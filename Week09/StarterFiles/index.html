<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Show Page</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- The markup and the CSS are done. Every empty element below has an id,
         and by the end of class JavaScript will have filled all of them in. -->

    <article class="ticket">
      <header class="poster">
        <p class="presents">The Fillmore East presents</p>
        <h1 class="billing" id="billing"></h1>
        <p class="where-when" id="where-when"></p>
      </header>

      <p class="status" id="status"></p>

      <section class="order">
        <h2>Your order</h2>

        <p class="line" id="price-line"></p>
        <p class="line" id="fee-line"></p>
        <p class="line discount" id="discount-line"></p>

        <p class="total">
          <span>Total</span>
          <strong id="total"></strong>
        </p>

        <p class="fine-print" id="fine-print"></p>
      </section>
    </article>

    <!-- The script goes at the END of the body, after the elements it talks
         to. Put it in the <head> and it runs before they exist. -->
    <script>
      /* =========================
        facts about the show
      ========================= */
      const headliner = "bad moon rising"
      const support = "the paper cuts"
      const venue = "the fillmore east"
      const doors = "friday 13 nov, doors 8pm"

      const ticketPrice = 18.5
      const capacity = 250
      const ticketSold = 243
      const serviceRateFee = 0.12
      const studentPrice = 5

      const isStudent = false

      const quantity = 3

      const ticketsLeft = capacity - ticketSold

      const subtotal = ticketPrice * quantity
      const serviceFee = subtotal * serviceRateFee
      const discount = isStudent ? studentPrice : 0

      const total = subtotal + serviceFee - discount

      const billing = `${headliner.toUpperCase()} + ${support}`
      const whereWhen = `${venue} * ${doors}`
      const priceLine = `${quantity} x ${ticketPrice.toFixed(2)}`

      const feeLine = `Service Fee: $${serviceFee.toFixed(2)}`
      const discountLine = isStudent ? `Student Discount: $${discount.toFixed(2)}` : ''
      const totalLine = `$${total.toFixed(2)}`

      document.querySelector('#billing').textContent = billing
      document.querySelector('#where-when').textContent = whereWhen
      document.querySelector('#price-line').textContent = priceLine
      document.querySelector('#fee-line').textContent = feeLine
      document.querySelector('#discount-line').textContent = discountLine
      document.querySelector('#total').textContent = totalLine

    </script>
  </body>
</html>
