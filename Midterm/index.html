<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IMBROKE</title>
    <link rel="stylesheet" type="text/css" href="./css/home.css" />
  </head>
  <body>
    <!-- navbar sticky to the top -->
    <header>
      <!-- logo and h2 website name ("IMBROKE") on the left -->
      <div class="brand">
        <a href="#">
          <img class="logo" src="./img/questionmark.png" alt="IMBROKE logo" />
        </a>
        <h2><a href="#">IMBROKE</a></h2>
      </div>

      <!-- Two links in the center, evenly spaced between the logo on the left and the right side div -->
      <nav>
        <ul class="menu">
          <li><a href="#">Women's</a></li>
          <li><a href="#">Men's</a></li>
        </ul>
      </nav>

      <!-- right side, questionmark icon, a link to My Cart and link to account settings, placeholder Name Name -->
      <div class="account">
        <img class="icon" src="./img/questionmark.png" alt="Help" />
        <a href="#">My Cart</a>
        <a href="#">Name Name</a>
      </div>
    </header>

    <!-- hero div, a grid of col 2 -->
    <div class="hero">
      <!-- hero image on the left, 50vh -->
      <img src="./img/greenpant.png" alt="Green pants" />
      <!-- hero text on the right, an h1 of some tagline and a paragraph for subtitle -->
      <article>
        <h1>SSSSSSSSSSSSSSSSSSS</h1>
        <p>ssssssssssssssssssssssssssssssss.</p>
      </article>
    </div>

    <!-- container for product thumbnails is 100% width -->
    <!-- flexbox justify evenly, 4 divs with padding -->
    <main class="container">
      <div class="thumb">
        <!-- image inside is width: 260px for now -->
        <img src="./img/redshirtsmall.png" alt="Red shirt" />
        <!-- below image is p tag with product name, price, and sizes -->
        <p>Red Shirt<br />$19.99<br />Sizes: S M L XL</p>
      </div>
      <div class="thumb">
        <img src="./img/blackjacketsmall.png" alt="Black jacket" />
        <p>Black Jacket<br />$59.99<br />Sizes: S M L XL</p>
      </div>
      <div class="thumb">
        <img src="./img/blueshortsmall.png" alt="Blue shorts" />
        <p>Blue Shorts<br />$24.99<br />Sizes: S M L XL</p>
      </div>
      <div class="thumb">
        <img src="./img/redshoesmall.png" alt="Red shoes" />
        <p>Red Shoes<br />$44.99<br />Sizes: 6 7 8 9 10</p>
      </div>
      <div class="thumb">
        <img src="./img/redshoesmall.png" alt="Red shoes" />
        <p>Red Shoes<br />$44.99<br />Sizes: 6 7 8 9 10</p>
      </div>
    </main>

    <div class="footer">

    </div>
  </body>
</html>
